<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="site-header__name" href="{{ '/' | relative_url }}">
      Patrick Kearns<span class="site-header__degree">, PhD</span>
    </a>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-nav">
      {% for item in site.nav %}
        {% assign is_current = false %}
        {% if page.url == item.url %}{% assign is_current = true %}{% endif %}
        <a href="{{ item.url | relative_url }}" {% if is_current %}aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var toggle = document.querySelector('.nav-toggle');
    var nav = document.querySelector('.site-nav');
    toggle.addEventListener('click', function () {
      var open = nav.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', open);
    });
  });
</script>
